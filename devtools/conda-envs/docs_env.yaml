name: pablo-docs
channels:
  - conda-forge
dependencies:
  # Base depends
  - python>=3.12,<3.13
  - pip

  # Documentation depends
  - myst-parser
  - sphinx==6.1.2
  - sphinx-notfound-page
  - autodoc-pydantic
  - sphinx-click
  - myst-nb
  - jupytext

  # Dev tools
  - sphinx-autobuild

  # Imports
  - openff-units
  - openff-toolkit>=0.17.0
  - polars
  - openmm
  - mdtraj
  - numpy
  - nglview==3.0.8
  # - nglview
  - mdanalysis
  - rdkit
  - pyxdg
  - rustworkx
  - gemmi

  #  Pip-only installs
  - pip:
      # Documentation depends
      - git+https://github.com/openforcefield/openff-sphinx-theme.git@main
      - sphinx-hoverxref
      - sphinx-paramlinks
