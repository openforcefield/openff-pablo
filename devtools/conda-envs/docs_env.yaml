name: pablo-docs
channels:
  - conda-forge
dependencies:
  # Base depends
  - python>=3.11
  - pip

  # Documentation
  - mkdocs
  - mkdocs-material
  - mkdocs-gen-files
  - mkdocs-literate-nav
  - mkdocs-jupyter
  - mkdocstrings
  - mkdocstrings-python >=1.10.8
  - griffe-pydantic
  - pymdown-extensions
  - ruff

  # Imports
  - openff-units
  - openff-toolkit>=0.16.8
  - polars
  - openmm
  - mdtraj
  - numpy
  - nglview
  - typer>=0.14
  - mdanalysis
  - rdkit
  - pyxdg
